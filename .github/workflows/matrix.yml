name: Matrix demo
on: push
jobs:
    build:
        continue-on-error: true
        strategy:
          matrix:                     # use this function to create array of node versions with defined machines
            node-version: [22, 24, 26]
            operating-system: [ubuntu-latest, windows-latest]
            include:                  # include the version
              - node-version: 26
                operating-system: ubuntu-latest
            exclude:                  # exclude the version
              - node-version: 22
                operating-system: windows-latest
        runs-on: ${{ matrix.operating-system }}
        steps:
            - name: Get Code
              uses: actions/checkout@v7
            - name: Install NodeJS
              uses: actions/setup-node@v7
              with:
                #node-version: 26
                node-version: ${{ matrix.node-version }}
            - name: Install Dependencies
              run: npm ci
            - name: Build project
              run: npm run build
