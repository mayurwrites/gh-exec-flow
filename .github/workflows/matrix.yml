name: Matrix demo
on: push
jobs:
    build:
        strategy:
          matrix:
            node-version: [12, 14, 16]
            operating-system: [ubun-latest, windows-latest]
        runs-on: ${{ matrix.operating-system }}
        steps:
            - name: Get Code
              uses: actions/checkout@v7
            - name: Install NodeJS
              uses: actions/setup-node@v7
              with:
                #node-version: 26
                node-version: ${{ matrix.node-version }}
            - name: Install Dependencies
              run: npm ci
            - name: Build project
              run: npm run build
